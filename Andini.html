<<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andini | Social Links</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(145deg, #eeeeee, #bdbdbd);
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 28px;
      padding: 34px 24px 26px;
      box-shadow: 0 18px 45px rgba(0,0,0,.16);
      text-align: center;
    }
    .avatar {
      width: 86px;
      height: 86px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #444, #999);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 30px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(0,0,0,.18);
    }
    h1 { font-size: 25px; margin-bottom: 7px; }
    .bio { color: #666; font-size: 14px; margin-bottom: 24px; }
    .links { display: grid; gap: 13px; }
    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 15px 18px;
      border-radius: 16px;
      background: #333;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: .2s ease;
      box-shadow: 0 6px 15px rgba(0,0,0,.12);
    }
    .link:hover { transform: translateY(-2px); background: #1f1f1f; }
    .icon {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: #555;
      font-size: 13px;
      flex-shrink: 0;
    }
    .link span:last-child { flex: 1; text-align: center; margin-right: 42px; }
    footer { margin-top: 22px; font-size: 12px; color: #777; }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">A</div>
    <h1>@andiniii</h1>
    <p class="bio">Find me on social media &amp; shop ✨</p>

    <div class="links">
      <a class="link" href="https://www.instagram.com/scarlettandinnn?stkn=MW4yNDM5bDc0eWZqZA==" target="_blank" rel="noopener noreferrer">
        <span class="icon">IG</span><span>Instagram</span>
      </a>

      <a class="link" href="https://www.tiktok.com/@andiniii577?_r=1&_t=ZS-99wGU3kvTcq" target="_blank" rel="noopener noreferrer">
        <span class="icon">TT</span><span>TikTok</span>
      </a>

      <a class="link" href="https://wa.me/qr/CLK5VZ6BNKWQN1" target="_blank" rel="noopener noreferrer">
        <span class="icon">WA</span><span>WhatsApp</span>
      </a>

      <a class="link" href="https://id.shp.ee/iyyf89n5?fromSource=copy_link&smtt=0.0.9" target="_blank" rel="noopener noreferrer">
        <span class="icon">S</span><span>Shopee</span>
      </a>
    </div>

    <footer>© 2026 Andini</footer>
  </main>
</body>
</html>
